group 'com.whelksoft.flutter_native_timezone'
version '1.0-SNAPSHOT'

// IMPORTANT: This file no longer declares its own buildscript classpaths.
// It uses the root project's AGP/Kotlin versions.

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'  // replaces 'kotlin-android'

android {
    namespace 'com.twbt.flutternativetimezone'

    // AGP 8.x style props
    compileSdk 34

    defaultConfig {
        minSdk 21            // AGP 8 requires minSdk >= 21
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Compile to Java 17 bytecode (safe for Android and plugins)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // keep kotlin sources in the same place
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Lint block (replaces deprecated lintOptions)
    lint {
        disable += ['InvalidPackage']
    }
}

// Use JDK 17 for Kotlin compilation (even if Gradle runs on JDK 21)
kotlin {
    jvmToolchain(17)
}

// Extra guard to ensure all Kotlin tasks emit 17 bytecode
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

// No explicit Kotlin stdlib dependency; Gradle/KGP handles it.
dependencies {
    // (empty on purpose)
}
